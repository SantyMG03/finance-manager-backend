spring.application.name=finances

# ===================================================================
# CONNECTION TO DB
# ===================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3307/${DB_NAME:finances_db}?serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# ===================================================================
# CONFIG JPA / HIBERNATE
# ===================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.user.name=admin
spring.security.user.password=admin

# ===================================================================
# EXTERNAL API
# ===================================================================
finnhub.api.key=${FINNHUB_API_KEY}

# ===================================================================
# WEB SERVER PORT
# ===================================================================
server.port=${APP_PORT:8080}

# ===================================================================
# REDIS CONFIG
# ===================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
# 5 min TTL
spring.cache.redis.time-to-live=300000

# ===================================================================
# JWT
# ===================================================================
jwt.secret=ThisIsAReallyLongSecretAndSecureKeyForThisFinanceAppThatIsBeingDevelop

# ===================================================================
# RESILIENCE4J (external API Finnhub)
# ===================================================================
# Circuit breaker: opens after 50% failures in the last 10 calls (min 5),
# stays open 10s, then allows 2 trial calls in half-open state.
resilience4j.circuitbreaker.instances.finnhub.register-health-indicator=true
resilience4j.circuitbreaker.instances.finnhub.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.finnhub.sliding-window-size=10
resilience4j.circuitbreaker.instances.finnhub.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.finnhub.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.finnhub.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.finnhub.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.finnhub.automatic-transition-from-open-to-half-open-enabled=true

# Retry: up to 3 attempts, 1s apart, only on network errors and 5xx responses.
resilience4j.retry.instances.finnhub.max-attempts=3
resilience4j.retry.instances.finnhub.wait-duration=1s
resilience4j.retry.instances.finnhub.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.finnhub.ignore-exceptions=org.springframework.web.client.HttpClientErrorException

# Rate limiter: 50 permits per 60s (Finnhub free tier is ~60 requests/min).
resilience4j.ratelimiter.instances.finnhub.limit-refresh-period=60s
resilience4j.ratelimiter.instances.finnhub.limit-for-period=50
resilience4j.ratelimiter.instances.finnhub.timeout-duration=500ms

# ===================================================================
# ACTUATOR (observe circuit breaker state)
# ===================================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true
