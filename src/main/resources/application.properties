spring.application.name=finances

# ===================================================================
# CONNECTION TO DB
# ===================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3307/${DB_NAME:finances_db}?serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# ===================================================================
# CONFIG JPA / HIBERNATE
# ===================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.user.name=admin
spring.security.user.password=admin

# ===================================================================
# EXTERNAL API
# ===================================================================
finnhub.api.key=${FINNHUB_API_KEY}

# ===================================================================
# WEB SERVER PORT
# ===================================================================
server.port=${APP_PORT:8080}

# ===================================================================
# REDIS CONFIG
# ===================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
# 5 min TTL
spring.cache.redis.time-to-live=300000

# ===================================================================
# JWT
# ===================================================================
jwt.secret=ThisIsAReallyLongSecretAndSecureKeyForThisFinanceAppThatIsBeingDevelop
